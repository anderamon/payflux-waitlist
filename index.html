<style>
:root {
  --bg: #080B08;
  --surface: #0F130F;
  --surface2: #141A14;
  --border: rgba(255,255,255,0.07);
  --green: #1AE05A;
  --green-dim: rgba(26,224,90,0.12);
  --green-glow: rgba(26,224,90,0.35);
  --text: #F2F5F2;
  --muted: #7A8A7A;
  --muted2: #4A5A4A;
  --r: 14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Satoshi',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(8,11,8,0.85);backdrop-filter:blur(20px);}
.logo{font-family:'Satoshi',sans-serif;font-weight:900;font-size:20px;letter-spacing:-0.04em;display:flex;align-items:center;gap:8px;}
.logo-icon{width:28px;height:28px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.logo span{color:var(--green);}
.nav-tag{font-size:12px;padding:5px 12px;border:1px solid rgba(26,224,90,0.3);border-radius:20px;color:var(--green);background:var(--green-dim);font-weight:500;animation:fadepulse 3s infinite;}
@keyframes fadepulse{0%,100%{opacity:1;}50%{opacity:0.6;}}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 24px 80px;text-align:center;position:relative;}
.hero::before{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(26,224,90,0.07) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-52%);pointer-events:none;}

.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(26,224,90,0.25);background:var(--green-dim);color:var(--green);font-size:13px;font-weight:500;padding:7px 16px;border-radius:30px;margin-bottom:36px;animation:slidedown 0.6s ease both;}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}
@keyframes slidedown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}

.hero-h1{font-family:'Instrument Serif',serif;font-size:clamp(44px,7vw,80px);font-weight:400;line-height:1.07;letter-spacing:-0.02em;max-width:780px;margin-bottom:24px;animation:slideup 0.7s 0.1s ease both;}
.hero-h1 em{font-style:italic;color:var(--green);}
@keyframes slideup{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.hero-sub{font-size:clamp(15px,2vw,18px);color:var(--muted);line-height:1.7;max-width:560px;margin-bottom:16px;animation:slideup 0.7s 0.2s ease both;}
.hero-spots{display:inline-block;font-size:14px;font-weight:700;color:var(--green);background:var(--green-dim);border:1px solid rgba(26,224,90,0.2);padding:6px 14px;border-radius:8px;margin-bottom:40px;animation:slideup 0.7s 0.25s ease both;}

/* CTA BUTTON */
.btn-cta{position:relative;display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#060906;font-family:'Satoshi',sans-serif;font-size:17px;font-weight:700;padding:17px 36px;border-radius:50px;border:none;cursor:pointer;letter-spacing:-0.01em;transition:transform 0.15s,box-shadow 0.15s;animation:slideup 0.7s 0.35s ease both,ctapulse 2.5s 1s infinite;text-decoration:none;z-index:1;}
.btn-cta::after{content:'';position:absolute;inset:-4px;border-radius:54px;background:transparent;border:2px solid var(--green);opacity:0;animation:ringpulse 2.5s 1s infinite;}
